[project]
name = "optimal-consumption"
version = "1.0.0"
description = "Package for computing the optimal portfolio and consumption rate in a stochastic factor model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.5",
    "numba>=0.63.0",
    "numpy>=2.2.6",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.12.10",
    "ty>=0.0.62",
]
